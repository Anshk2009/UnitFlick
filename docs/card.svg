<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" width="660" height="260" role="img" aria-label="Illustration: a sentence on a webpage with '20 km' highlighted, and UnitFlick's result card below it showing 20 km converted to 12.43 miles.">
  <title>UnitFlick result card</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
    <style>
      .page  { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #3d434d; }
      .from  { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #9aa0a6; }
      .to    { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #f2f2f2; }
      .note  { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #e8b339; }
      .btn   { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #f2f2f2; }
      .menu  { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1c1c1e; }
    </style>
  </defs>

  <!-- the webpage underneath -->
  <rect width="660" height="260" rx="10" fill="#ffffff"/>
  <rect width="660" height="260" rx="10" fill="none" stroke="#e4e7ec"/>

  <text class="page" x="34" y="46">The trail climbs steadily for another</text>
  <rect x="286" y="30" width="52" height="22" rx="3" fill="#b4d5fe"/>
  <text class="page" x="291" y="46">20 km</text>
  <text class="page" x="344" y="46">before the ridge.</text>

  <!-- context menu -->
  <g filter="url(#shadow)">
    <rect x="286" y="64" width="188" height="34" rx="7" fill="#fbfbfc" stroke="#d8dce2"/>
    <rect x="290" y="68" width="180" height="26" rx="5" fill="#eaf0fe"/>
    <text class="menu" x="302" y="85">UnitFlick → Convert</text>
  </g>

  <!-- the result card -->
  <g filter="url(#shadow)">
    <rect x="286" y="110" width="256" height="124" rx="10" fill="#1e1f22" stroke="#3a3c40"/>

    <text class="from" x="302" y="134">20 km</text>
    <text class="to"   x="302" y="160">12.43 mi</text>

    <rect x="302" y="174" width="54" height="22" rx="6" fill="#33353a" stroke="#4a4d52"/>
    <text class="btn" x="315" y="189">Copy</text>

    <rect x="364" y="174" width="56" height="22" rx="6" fill="#33353a" stroke="#4a4d52"/>
    <text class="btn" x="376" y="189">Close</text>

    <text class="note" x="302" y="216">Rates from open.er-api.com, updated 3 h ago</text>
  </g>
</svg>
